name: iPhone web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Export mobile web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: toepnacht-iphone-web
          path: build/web
          if-no-files-found: error

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Create cache-proof versioned preview
        run: |
          mkdir -p build/pages
          cp -a build/web/. build/pages/
          mkdir -p "build/pages/${GITHUB_SHA}"
          cp -a build/web/. "build/pages/${GITHUB_SHA}/"

      - name: Upload GitHub Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish iPhone preview
        id: deployment
        uses: actions/deploy-pages@v4
